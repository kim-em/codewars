name = "codewars-kata"
testDriver = "workspace_test"

# Only the trusted workspace_test target is in defaultTargets — user
# code in Submission.lean is built by comparator inside landrun, not
# by `lake build` outside the sandbox.
defaultTargets = ["workspace_test"]

[leanOptions]
autoImplicit = false

# Mathlib variant only. Path-dep so the runner needs no network
# access at submission time. The path is materialised by
# scripts/install-mathlib.sh at image-build time. ${CODEWARS_MATHLIB_DIR}
# from versions.env, defaults to /opt/codewars/mathlib.
[[require]]
name = "mathlib"
path = "/opt/codewars/mathlib"

[[lean_lib]]
name = "ChallengeDeps"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "Submission"

[[lean_exe]]
name = "workspace_test"
root = "WorkspaceTest"
